# ---------------------------------------------------------------------------
# CURRENT MODE: FULL SITE
#
# filigrana.hn serves the real Astro site built from site/ + content/.
# The "under construction" page in placeholder/ is kept, unpublished, so the
# site can be swapped back to it in a hurry if that's ever needed.
#
# Develop locally with:
#
#     cd site && npm run dev        # http://localhost:4321
#
# localhost counts as a secure context, so the password gates behave exactly
# as they do in production.
#
# ---------------------------------------------------------------------------
# TO GO BACK TO THE PLACEHOLDER, reverse these three changes:
#
#   1. paths:  comment out "site/**" and "content/**", add "placeholder/**"
#   2. steps:  comment out the "Set up Node" / "Install dependencies" /
#              "Build" block
#   3. upload: change `path: site/dist` back to `path: placeholder`
#
# site/public/CNAME and placeholder/CNAME both hold the domain, so the custom
# domain keeps working in either mode — keep the two in sync if it changes.
# ---------------------------------------------------------------------------

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/**"
      - ".github/workflows/deploy.yml"
      # - "placeholder/**"   # re-enable when serving the placeholder
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist # change to `placeholder` to serve the holding page

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
