<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
body{margin:0;font-family:sans-serif;background:#c9c2ad}
.row{display:flex;flex-wrap:wrap}
.cell{padding:30px;flex:1;min-width:360px}
.cell h4{margin:0 0 10px;font:600 11px/1 monospace;letter-spacing:.15em;color:#333}
.white{background:#fff}.paper{background:#e9dfc7}.dark{background:#1a2b22}
.dark h4{color:#cbb}
img{width:100%;display:block}
</style></head><body>
<div class="row">
  <div class="cell white"><h4>WHITE</h4><img src="Logo.svg"></div>
  <div class="cell paper"><h4>VITELA</h4><img src="Logo.svg"></div>
</div>
</body></html>
